<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro de Categorías</title>
</head>

<body>

<h1>Registro de categorias</h1>

<form method="POST">

    {% csrf_token %}

    <p>
        <label>Nombre:</label><br>
        <input
            type="text"
            name="nombre"
            value="{{ categorias.nombre|default:'' }}"
            required
        >
    </p>

    
    <p>
        <label>Observaciones:</label><br>
        <textarea
            name="observaciones"
            required
        >{{ categorias.observaciones|default:'' }}</textarea>
    </p>

    <button type="submit">
        Guardar
    </button>

</form>

<br>

<a href="/categorias/lista/">
    Ver categorías
</a>

</body>

</html>
