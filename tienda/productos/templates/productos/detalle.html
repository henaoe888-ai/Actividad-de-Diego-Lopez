<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Detalle de Producto</title>
</head>

<body>

<h1>Detalle del producto</h1>

<p>
    <strong>Nombre:</strong>
    {{ productos.nombre }}
</p>

<p>
    <strong>Categoría:</strong>
    {{ productos.categoria }}
</p>

<p>
    <strong>Precio:</strong>
    {{ productos.precio }}
</p>

<p>
    <strong>Stock:</strong>
    {{ productos.stock }}
</p>

<br>

<a href="/productos/editar/{{ producto.id }}/">
    Editar
</a>

<br><br>

<a href="/productos/listar/">
    Volver
</a>

</body>

</html>
